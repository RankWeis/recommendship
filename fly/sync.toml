# PowerSync. Deploy from the repo root: fly deploy --config fly/sync.toml
# Secrets (fly secrets set): PS_SOURCE_DB_URI, PS_STORAGE_DB_URI
app = "recommendship-sync"
primary_region = "sjc"

[build]
  dockerfile = "../docker/powersync/Dockerfile"

[env]
  PS_PORT = "8080"
  PS_SSLMODE = "verify-full"
  PS_JWKS_URI = "https://recommendship-api.fly.dev/api/auth/jwks"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero: stops when no device is connected and starts on the next
  # sync request, picking up replication where it left off. While it's stopped,
  # Neon's compute can sleep too. A daily keep-alive (.github/workflows/keepalive.yml)
  # wakes it so Neon doesn't drop the idle replication slot (after ~40 hours).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [http_service.concurrency]
    type = "connections"
    # Every open app holds one connection. Load-tested locally at this machine's size: 2,000
    # connections took ~320 MB and first syncs stayed under 0.1 s (docs/deploy.md).
    # PowerSync's own cap (max_concurrent_connections in service.yaml) matches.
    soft_limit = 1500
    hard_limit = 2000

[checks]
  [checks.alive]
    type = "tcp"
    port = 8080
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
