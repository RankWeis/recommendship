<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#1f6f5c" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="icon" href="%sveltekit.assets%/icon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<title>Recommendship</title>
		<!--
			Link previews. Reddit, iMessage, Slack and the rest read these without running any
			JS, so they live here rather than in a <svelte:head>. The URL and image are the
			production address on purpose: a staging link previews as the real thing, and
			scrapers need an absolute image URL.
		-->
		<meta
			name="description"
			content="Log who recommends what to you, rate it once you've tried it, and let each person's track record predict which picks to try next."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Recommendship" />
		<meta property="og:title" content="Recommendship" />
		<meta
			property="og:description"
			content="Log who recommends what to you, rate it once you've tried it, and let each person's track record predict which picks to try next."
		/>
		<meta property="og:url" content="https://recommendship.app/" />
		<meta property="og:image" content="https://recommendship.app/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Recommendship: track who recommends what, and learn whose picks you love." />
		<meta name="twitter:card" content="summary_large_image" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
